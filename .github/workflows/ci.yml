name: Project checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_BROWSER_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_CPUS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build:compile
