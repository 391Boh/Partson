# https://www.partson.shop → https://partson.shop (301)
#
# Стан на 2026-10-07: http://www.* і http://* уже дають 301 на
# https://partson.shop, але https://www.partson.shop/* відповідає 200 тим самим
# HTML (canonical веде на apex, тож це дубль хоста, а не помилка індексації).
#
# Як застосувати (на сервері, не з репозиторію):
#   1. Знайдіть server-блок, який зараз обслуговує 443 для www:
#        sudo nginx -T | grep -n "server_name"
#   2. Приберіть www.partson.shop із server_name основного 443-блоку
#      (там має лишитися лише partson.shop) і додайте блок нижче.
#      Шляхи до сертифіката візьміть з основного блоку — сертифікат уже
#      покриває www (TLS-рукостискання для www проходить).
#   3. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.partson.shop;

    ssl_certificate     /etc/letsencrypt/live/partson.shop/fullchain.pem;  # ← як в основному блоці
    ssl_certificate_key /etc/letsencrypt/live/partson.shop/privkey.pem;    # ← як в основному блоці

    return 301 https://partson.shop$request_uri;
}

# Перевірка після reload (очікується 301 і Location на apex з тим самим шляхом і query):
#   curl -sSI https://www.partson.shop/ | grep -iE "^(HTTP|location)"
#   curl -sSI "https://www.partson.shop/product/filtr-povitryanyy-megane-02-af1912?x=1" | grep -iE "^(HTTP|location)"
#   curl -sSI https://partson.shop/ | grep -iE "^HTTP"        # має лишитися 200
#   curl -sSI http://www.partson.shop/ | grep -iE "^(HTTP|location)"  # 301 → https://partson.shop/
