<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2c"/>
      <stop offset=".55" stop-color="#0d2537"/>
      <stop offset="1" stop-color="#16193a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".2" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset=".8" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".05" cy=".95" r=".5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
